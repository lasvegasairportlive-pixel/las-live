<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Official links for LAS Vegas Airport LIVE — 24/7 views of departures and arrivals.">
  <title>LAS Vegas Airport LIVE™</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23CE3F22'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #070b14;
      --red: #ce3f22;
      --red-soft: rgba(206, 63, 34, 0.18);
      --white: #ffffff;
      --cream: #f3eade;
      --silver: #d2c8be;
      --muted: #9a9086;
      --btn: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.09);
      --btn-border: rgba(255, 255, 255, 0.14);
      --amber: #eaa433;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Inter, "Helvetica Neue", system-ui, sans-serif;
      background: var(--bg);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .sky {
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 90% 42% at 50% -8%, rgba(206, 63, 34, 0.22), transparent 58%),
        radial-gradient(ellipse 70% 36% at 50% 100%, rgba(234, 164, 51, 0.12), transparent 55%),
        radial-gradient(ellipse 50% 28% at 80% 18%, rgba(217, 133, 41, 0.08), transparent 60%),
        linear-gradient(180deg, #0a0c14 0%, #070b14 46%, #05080f 100%);
    }
    /* faint star field */
    .sky::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 28% 8%, rgba(255,255,255,.35), transparent),
        radial-gradient(1.5px 1.5px at 73% 14%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 88% 22%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 6% 42%, rgba(255,255,255,.28), transparent),
        radial-gradient(1.4px 1.4px at 94% 48%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 18% 62%, rgba(255,255,255,.22), transparent),
        radial-gradient(1px 1px at 62% 6%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.2px 1.2px at 44% 16%, rgba(255,255,255,.25), transparent);
      opacity: .7;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 24px 22px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: min(68%, 248px);
      height: auto;
      display: block;
      margin: 2px 0 0;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.45));
    }
    .tag {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }
    .links {
      list-style: none;
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links a {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 10px 16px 10px 14px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      background: var(--btn);
      border: 1px solid var(--btn-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      background: var(--btn-hover);
      border-color: rgba(206, 63, 34, 0.85);
      box-shadow: 0 8px 28px rgba(206, 63, 34, 0.16);
      transform: translateY(-1px);
    }
    .links a:active { transform: translateY(0); }
    .links a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }
    .links a.primary {
      background: var(--red);
      border-color: #d85a3a;
      color: var(--white);
      box-shadow: 0 10px 28px rgba(206, 63, 34, 0.32);
    }
    .links a.primary:hover,
    .links a.primary:focus-visible {
      background: #dc4e2e;
      border-color: #e56a4a;
      box-shadow: 0 12px 32px rgba(206, 63, 34, 0.40);
    }
    .icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.07);
    }
    .primary .icon { background: rgba(0,0,0,0.18); }
    .icon svg { width: 22px; height: 22px; fill: currentColor; display: block; }
    .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .name {
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .handle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--silver);
      letter-spacing: 0.01em;
    }
    .primary .handle { color: rgba(255,255,255,0.88); }
    .chev {
      flex: 0 0 auto;
      color: rgba(255,255,255,0.45);
      display: grid;
      place-items: center;
    }
    .primary .chev { color: rgba(255,255,255,0.85); }
    .chev svg { width: 18px; height: 18px; }
    footer {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
    }
    footer .tm {
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--silver);
      font-size: 12px;
    }
    /* runway lights along the bottom */
    .runway {
      position: relative;
      z-index: 1;
      pointer-events: none;
      width: min(430px, 100%);
      margin: auto auto 10px;
      height: 64px;
      padding: 0 22px calc(8px + var(--safe-b));
      flex: 0 0 auto;
    }
    .runway .edge {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .runway .lamp {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px 2px rgba(224, 176, 74, 0.55);
      opacity: .85;
    }
    .runway .lamp:nth-child(odd) {
      background: #f4f6fa;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.4);
    }
    .centerline {
      height: 2px;
      margin: 10px 8px 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.55) 0 16px,
        transparent 16px 28px
      );
      opacity: .35;
    }
    @media (min-width: 500px) {
      .wrap { padding-top: 52px; }
    }
  </style>
</head>
